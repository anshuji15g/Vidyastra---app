<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study War 12th - Smart AI Tutor</title>
    
    <!-- External CSS Link -->
    <link rel="stylesheet" href="style.css">

    <!-- Highlight.js for code formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>

    <div id="app-container">
        <!-- Logo Bar with Made by Ayushman -->
        <div class="header-logo">
            <div class="neon-h">H</div>
            <div class="logo-text">
                <span class="main-title">Study War 12th</span>
                <span class="sub-title">MADE BY AYUSHMAN</span>
            </div>
        </div>

        <!-- 1. Name Setup Screen -->
        <div id="onboarding-screen">
            <h2>Study War 12th में आपका स्वागत है!</h2>
            <p style="color: var(--text-muted);">आपका शुभ नाम क्या है?</p>
            <input type="text" id="user-name-input" placeholder="अपना नाम लिखें..." autocomplete="off">
            <button id="start-btn">शुरू करें ➔</button>
        </div>

        <!-- 2. Main Chat Screen -->
        <div id="chat-screen">
            <div id="chat-messages"></div>
            
            <div id="input-area">
                <input type="text" id="user-input" placeholder="कोई भी सवाल पूछें (Maths, Science, Routine)...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        // API Configuration (Insert your valid Gemini API key starting with AIzaSy below)
        const API_KEY = "YOUR_GEMINI_API_KEY_HERE";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        const SYSTEM_PROMPT = `You are "Study War 12th", an AI personal tutor created by Ayushman for Class 10th, 11th, 12th, NEET, and JEE students.
        RULES:
        1. Answer in easy Hindi or Hinglish.
        2. Give complete, step-by-step detailed explanations from Basic to Advanced level with easy real-life examples so the student doesn't need to ask again.
        3. Keep full focus on study, formula, concepts, and daily routines.`;

        const onboardingScreen = document.getElementById('onboarding-screen');
        const chatScreen = document.getElementById('chat-screen');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        let userName = localStorage.getItem('study_war_user_name') || "";
        let chatHistory = [];

        // Auto login if name exists
        if (userName) {
            showChatScreen();
        }

        document.getElementById('start-btn').addEventListener('click', saveNameAndStart);
        document.getElementById('user-name-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') saveNameAndStart();
        });

        function saveNameAndStart() {
            const inputVal = document.getElementById('user-name-input').value.trim();
            if(!inputVal) { alert("कृपया अपना नाम दर्ज करें!"); return; }
            userName = inputVal;
            localStorage.setItem('study_war_user_name', userName);
            showChatScreen();
        }

        function showChatScreen() {
            onboardingScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            
            showAiMessage(`Hello ${userName} 👋! मैं आपकी क्या मदद कर सकता हूँ? आप मुझसे 10th, 12th, NEET, या किसी भी प्रतियोगी परीक्षा की सही तैयारी के लिए सवाल पूछ सकते हैं।`, false);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleSend();
        });

        function handleSend() {
            const text = userInput.value.trim();
            if(!text) return;
            
            showUserMessage(text);
            userInput.value = '';
            
            getAiResponse(text);
        }

        function showUserMessage(text) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row user';
            rowDiv.innerHTML = `
                <span class="emoji-avatar">🧑‍💻</span>
                <div class="message user-message">${escapeHtml(text)}</div>
            `;
            chatMessages.appendChild(rowDiv);
            scrollToBottom();
        }

        function showAiMessage(text, isAnswer = true) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row ai';
            
            // Mandatory Line at top of every answer
            let quoteHtml = isAnswer ? `<div class="mandatory-quote">📌 पहले पढ़ाई करें फिर मस्ती करें</div>` : '';
            let formattedContent = formatMarkdown(text);

            rowDiv.innerHTML = `
                <span class="emoji-avatar">🤖</span>
                <div class="message ai-message">
                    ${quoteHtml}
                    <div>${formattedContent}</div>
                </div>
            `;
            chatMessages.appendChild(rowDiv);
            if(window.hljs) hljs.highlightAll();
            scrollToBottom();
        }

        function showTyping() {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row ai';
            rowDiv.id = 'typing-indicator-row';
            rowDiv.innerHTML = `
                <span class="emoji-avatar">🤖</span>
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            chatMessages.appendChild(rowDiv);
            scrollToBottom();
        }

        function hideTyping() {
            const indicator = document.getElementById('typing-indicator-row');
            if(indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatMarkdown(text) {
            let formatted = text
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
            return formatted;
        }

        async function getAiResponse(userMessage) {
            showTyping();

            let contents = [
                { role: "user", parts: [{ text: SYSTEM_PROMPT + ` (Student Name: ${userName})` }] },
                { role: "model", parts: [{ text: "समझ गया! मैं Study War 12th AI Tutor हूँ।" }] }
            ];
            
            chatHistory.slice(-6).forEach(msg => {
                contents.push({ role: msg.role, parts: [{ text: msg.text }] });
            });

            contents.push({ role: "user", parts: [{ text: userMessage }] });

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();
                hideTyping();

                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                    let aiText = data.candidates[0].content.parts[0].text;
                    chatHistory.push({role: "user", text: userMessage});
                    chatHistory.push({role: "model", text: aiText});

                    showAiMessage(aiText, true);
                } else {
                    // Smart Fallback Answer if API key is invalid
                    generateOfflineAnswer(userMessage);
                }

            } catch (error) {
                hideTyping();
                console.error("API Error:", error);
                generateOfflineAnswer(userMessage);
            }
        }

        // Automatic Smart Fallback Engine
        function generateOfflineAnswer(msg) {
            let lower = msg.toLowerCase();
            let reply = "";

            if (lower.includes("algebra") || lower.includes("formula") || lower.includes("math")) {
                reply = "यहाँ बीजगणित (Algebra) के बेसिक से लेकर एडवांस तक के मुख्य फ़ॉर्मूले दिए गए हैं:\n\n" +
                        "1. **(a + b)²** = a² + 2ab + b²\n" +
                        "2. **(a - b)²** = a² - 2ab + b²\n" +
                        "3. **a² - b²** = (a - b)(a + b)\n" +
                        "4. **(a + b)³** = a³ + b³ + 3ab(a + b)\n" +
                        "5. **(a - b)³** = a³ - b³ - 3ab(a - b)\n" +
                        "6. **a³ + b³** = (a + b)(a² - ab + b²)\n" +
                        "7. **a³ - b³** = (a - b)(a² + ab + b²)\n" +
                        "8. **Dharacharya Formula (Quadratic Equation):** x = [-b ± √(b² - 4ac)] / 2a\n\n" +
                        "इन फ़ॉर्मूलों को याद रखें, यह Class 10th, 12th और प्रतियोगी परीक्षाओं में काम आते हैं!";
            } else if (lower.includes("hello") || lower.includes("hi")) {
                reply = `नमस्ते ${userName}! आप पढ़ाई से जुड़ा कोई भी सवाल पूछें (जैसे: Algebra formulas, Newton's laws, Daily study routine).`;
            } else {
                reply = `मैंने आपका सवाल **"${msg}"** समझ लिया है। पढ़ाई को आसान बनाने के लिए हमेशा बेसिक कॉन्सेप्ट्स को समझें और लिखकर प्रैक्टिस करें!`;
            }

            showAiMessage(reply, true);
        }
    </script>
</body>
</html>
