<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search SEO Tags -->
    <title>Vidyastra - Study War 12th | Smart AI Tutor</title>
    <meta name="description" content="Vidyastra (Study War 12th) - Free AI Tutor by Ayushman Tiwari for Class 11th, 12th, NEET, UPSC & UPP.">
    <meta name="keywords" content="Vidyastra, Study War 12th, Ayushman Tiwari, Study War AI">
    <meta name="author" content="Ayushman Tiwari">
    <meta name="robots" content="index, follow">
    
    <!-- Code Formatting Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0e11;
            --container-bg: #15191e;
            --text-primary: #ffffff;
            --text-secondary: #a0aab5;
            --cyan-glow: #00e5ff;
            --purple-glow: #bd00ff;
            --bubble-user: #1f262e;
            --bubble-ai: #2b343f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            height: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            background-color: var(--container-bg);
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Neon Header Logo */
        .header-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(21, 25, 30, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            z-index: 100;
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(8px);
        }

        .neon-h {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--cyan-glow) 0%, var(--purple-glow) 100%);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.6), 0 0 18px rgba(189, 0, 255, 0.6);
            color: white;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -1px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff 40%, var(--cyan-glow) 70%, var(--purple-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 11px;
            color: var(--cyan-glow);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        /* Onboarding Screen */
        #onboarding-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 30px;
            gap: 22px;
            text-align: center;
            z-index: 10;
            background-color: var(--container-bg);
        }

        #onboarding-screen h2 {
            font-size: 26px;
            background: linear-gradient(90deg, #fff, var(--cyan-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #onboarding-screen input {
            padding: 16px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #0e1115;
            color: white;
            width: 85%;
            max-width: 320px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        #onboarding-screen button {
            padding: 16px 36px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(90deg, var(--cyan-glow), var(--purple-glow));
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 20px rgba(189, 0, 255, 0.5);
        }

        /* Chat Screen */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 90%;
            padding-top: 85px;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .emoji-avatar {
            font-size: 26px;
            display: inline-block;
            animation: emojiBounce 2s ease-in-out infinite;
            user-select: none;
            flex-shrink: 0;
        }

        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            animation: bounceIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--bubble-user);
            border-bottom-right-radius: 4px;
            color: #eee;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ai-message {
            background-color: var(--bubble-ai);
            border-bottom-left-radius: 4px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .mandatory-quote {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.2), rgba(189, 0, 255, 0.2));
            border-left: 4px solid var(--cyan-glow);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--cyan-glow);
            font-size: 14px;
        }

        #input-area {
            display: flex;
            padding: 12px 16px;
            background-color: #0d1014;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        #user-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #161b22;
            color: white;
            font-size: 15px;
            outline: none;
        }

        #send-btn {
            background: linear-gradient(135deg, var(--cyan-glow), var(--purple-glow));
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
            flex-shrink: 0;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes emojiBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px) rotate(8deg); }
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 14px 20px;
            background: var(--bubble-ai);
            border-radius: 18px;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--cyan-glow);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Header Logo -->
        <div class="header-logo">
            <div class="neon-h">H</div>
            <div class="logo-text">
                <span class="main-title">Study War 12th</span>
                <span class="sub-title">Made by Ayushman-Sahil</span>
            </div>
        </div>

        <!-- 1. Name Setup Screen -->
        <div id="onboarding-screen">
            <h2>Study War 12th में आपका स्वागत है!</h2>
            <p style="color: var(--text-secondary);">आपका शुभ नाम क्या है?</p>
            <input type="text" id="user-name-input" placeholder="अपना नाम लिखें..." autocomplete="off">
            <button id="start-btn">शुरू करें ➔</button>
        </div>

        <!-- 2. Main Chat Screen -->
        <div id="chat-screen">
            <div id="chat-messages"></div>
            
            <div id="input-area">
                <input type="text" id="user-input" placeholder="कोई भी सवाल पूछें (Maths, Physics, Bio, UPSC, UPP)...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const onboardingScreen = document.getElementById('onboarding-screen');
        const chatScreen = document.getElementById('chat-screen');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        let userName = localStorage.getItem('study_war_user_name') || "";

        if (userName) {
            showChatScreen();
        }

        document.getElementById('start-btn').addEventListener('click', saveNameAndStart);
        document.getElementById('user-name-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') saveNameAndStart();
        });

        function saveNameAndStart() {
            const inputVal = document.getElementById('user-name-input').value.trim();
            if(!inputVal) { alert("कृपया अपना नाम दर्ज करें!"); return; }
            userName = inputVal;
            localStorage.setItem('study_war_user_name', userName);
            showChatScreen();
        }

        function showChatScreen() {
            onboardingScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            
            // Initial greeting with name
            showAiWelcome(`Hello ${userName} 👋! मैं "Study War 12th" आपका पर्सनल AI ट्यूटर हूँ। मुझसे 10th, 11th, 12th, Physics, Biology, Chemistry, NEET, UPSC, UPP, PYQ या Time-Table से जुड़ा कोई भी सवाल गहराई से पूछें!`);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleSend();
        });

        function handleSend() {
            const text = userInput.value.trim();
            if(!text) return;
            
            showUserMessage(text);
            userInput.value = '';
            
            generateSmartResponse(text);
        }

        function showUserMessage(text) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row user';
            rowDiv.innerHTML = `
                <span class="emoji-avatar">🧑‍💻</span>
                <div class="message user-message">${escapeHtml(text)}</div>
            `;
            chatMessages.appendChild(rowDiv);
            scrollToBottom();
        }

        function showAiWelcome(text) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row ai';
            rowDiv.innerHTML = `
                <span class="emoji-avatar">🤖</span>
                <div class="message ai-message">
                    <div>${text}</div>
                </div>
            `;
            chatMessages.appendChild(rowDiv);
            scrollToBottom();
        }

        function showAiAnswer(text) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row ai';
            rowDiv.innerHTML = `
                <span class="emoji-avatar">🤖</span>
                <div class="message ai-message">
                    <div class="mandatory-quote">Pahle padhai kare phir Masti kare</div>
                    <div>${formatMarkdown(text)}</div>
                </div>
            `;
            chatMessages.appendChild(rowDiv);
            if(window.hljs) hljs.highlightAll();
            scrollToBottom();
        }

        function showTyping() {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row ai';
            rowDiv.id = 'typing-indicator-row';
            rowDiv.innerHTML = `
                <span class="emoji-avatar">🤖</span>
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            chatMessages.appendChild(rowDiv);
            scrollToBottom();
        }

        function hideTyping() {
            const indicator = document.getElementById('typing-indicator-row');
            if(indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatMarkdown(text) {
            return text
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        // Complete Offline Knowledge Engine
        function generateSmartResponse(userQuery) {
            showTyping();

            setTimeout(() => {
                hideTyping();
                let lower = userQuery.toLowerCase();
                let ans = "";

                if (lower.includes("physics") || lower.includes("भौतिकी") || lower.includes("गॉस") || lower.includes("कूलाम") || lower.includes("किरचॉफ")) {
                    ans = "**⚛️ Class 12th Physics - मुख्य नियम:**\n\n" +
                          "**1. कूलाम का नियम:** F = k × (q₁q₂ / r²)\n" +
                          "**2. गॉस की प्रमेय:** Φ = Q / ε₀\n" +
                          "**3. किरचॉफ का नियम:** ΣI = 0 (आवेश संरक्षण) एवं ΣIR = ΣE (ऊर्जा संरक्षण)।";
                }
                else if (lower.includes("biology") || lower.includes("जीव विज्ञान") || lower.includes("dna") || lower.includes("मेंडल")) {
                    ans = "**🧬 Biology Special:**\n\n" +
                          "**1. DNA डबल हेलिक्स मॉडल:** वाटसन एवं क्रिक द्वारा दिया गया (A=T, G≡C)।\n" +
                          "**2. मेंडल के नियम:** प्रभाविता का नियम, पृथक्करण का नियम एवं स्वतंत्र अपव्यूहन का नियम।";
                }
                else if (lower.includes("chemistry") || lower.includes("रसायन") || lower.includes("ऑर्गेनिक")) {
                    ans = "**🧪 Chemistry Special:**\n\n" +
                          "**1. राउल्ट का नियम:** P = P° × X\n" +
                          "**2. वर्ट्ज़ अभिक्रिया:** 2R-X + 2Na ➔ R-R + 2NaX (शुष्क ईथर की उपस्थिति में)।";
                }
                else if (lower.includes("upsc") || lower.includes("ias") || lower.includes("ips")) {
                    ans = "**🏛️ UPSC CSE गाइड:**\n\n" +
                          "• **Prelims:** GS Paper 1 (Cutoff) + CSAT (33% क्वालीफाइंग)।\n" +
                          "• **Mains:** Essay + GS 1, 2, 3, 4 Ethics + Optional (1750 अंक)।\n" +
                          "• **Interview:** 275 अंक।";
                }
                else if (lower.includes("neet") || lower.includes("डॉक्टर") || lower.includes("mbbs")) {
                    ans = "**🩺 NEET UG पैटर्न:**\n\n" +
                          "• **कुल 720 अंक:** Biology (360) + Chemistry (180) + Physics (180)।\n" +
                          "• पूरी तरह NCERT बुक्स पर फोकस करें।";
                }
                else if (lower.includes("upp") || lower.includes("up police") || lower.includes("कांस्टेबल")) {
                    ans = "**👮 UPP (UP Police) पैटर्न:**\n\n" +
                          "• **150 प्रश्न (300 अंक):** GK (38), हिंदी (37), Maths (38), Reasoning (37)।";
                }
                else if (lower.includes("pyq") || lower.includes("पेपर")) {
                    ans = "**📝 PYQs संग्रह:**\n\n" +
                          "• **Physics:** लेंस मेकर सूत्र 1/f = (n - 1)(1/R₁ - 1/R₂)\n" +
                          "• **Biology:** मनुष्य में 46 गुणसूत्र होते हैं।\n" +
                          "• **UPP:** UP का शास्त्रीय नृत्य 'कथक' है।";
                }
                else if (lower.includes("algebra") || lower.includes("formula") || lower.includes("गणित")) {
                    ans = "**📐 Algebra Formulas:**\n\n" +
                          "• (a + b)² = a² + 2ab + b²\n" +
                          "• (a - b)² = a² - 2ab + b²\n" +
                          "• श्रीधराचार्य फ़ॉर्मूला: x = [-b ± √(b² - 4ac)] / 2a";
                }
                else {
                    ans = `आपका सवाल **"${userQuery}"** महत्वपूर्ण है। बेसिक मजबूत करने के लिए डेली NCERT पढ़ें और नोट्स बनाएं!`;
                }

                showAiAnswer(ans);
            }, 600);
        }
    </script>
</body>
</html>
